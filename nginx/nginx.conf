# SafeMail TLS-front: терминирует HTTPS и проксирует на frontend (Next.js).
# API идёт через same-origin /backend/* самого фронта — напрямую к gateway ходить не надо.
# Серты — самоподписанные, генерируются ./gen-certs.sh (в репо НЕ коммитятся).

# Апстрим через переменную, а не блок upstream: nginx резолвит имя в момент
# запроса (докер-DNS 127.0.0.11, valid=30s переживает пересоздание фронта),
# поэтому стартует при любом порядке контейнеров. Порт — только здесь:
# на имени upstream-группы в proxy_pass порт запрещён
# (emerg 'upstream "frontend" may not have port 3008').

# HTTP — только редирект на HTTPS
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/safemail.crt;
  ssl_certificate_key /etc/nginx/certs/safemail.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Вложения до 20 МБ + запас на multipart
  client_max_body_size 25m;

  resolver 127.0.0.11 valid=30s;
  set $upstream_frontend frontend:3008;

  # Next.js dev HMR (websocket) + обычный прокси
  location / {
    proxy_pass http://$upstream_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}

# Маппинг Upgrade-заголовка для HMR-сокета (должен быть на верхнем уровне)
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
