server:
  port: 8080

spring:
  task:
    scheduling:
      # B: pollAndProcess возвращается сразу (раздача по пулу), но второй поток
      # шедулера страхует от залипания, если раздача когда-то подвиснет.
      pool:
        size: 2
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safemail}
    username: ${SPRING_DATASOURCE_USERNAME:safemail}
    password: ${SPRING_DATASOURCE_PASSWORD:safemail}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_RELAY_HOST:localhost}
    port: ${MAIL_RELAY_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          # Мёртвый relay не должен вешать /send: быстрая 500 с текстом,
          # которую фронт показывает пользователю (см. FAILED-строки).
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 5000
          starttls:
            enable: false

mail:
  # Обязателен: без MAIL_DOMAIN контекст не стартует (fail-fast).
  # Захардкоженного дефолта здесь нет — значение только из env (.env → compose).
  domain: ${MAIL_DOMAIN}

smtp:
  host: ${SMTP_HOST:0.0.0.0}
  port: ${SMTP_PORT:2525}
  submission-port: ${SUBMISSION_PORT:2587}

ml:
  parser-url: ${PARSER_URL:http://localhost:8001}
  enrich-url: ${ENRICH_URL:http://localhost:8002}
  classify-url: ${CLASSIFY_URL:http://localhost:8003}

app:
  jwt-secret: ${JWT_SECRET:change-me-to-32-chars-minimum-secret-12345}
  jwt-ttl-minutes: 720
