services:
  postgres:
    image: postgres:16-alpine
    container_name: safemail-pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safemail}
      POSTGRES_USER: ${POSTGRES_USER:-safemail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safemail}
    ports:
      # Хост-порт наружу; внутри сети gateway ходит на postgres:5432 — не трогать.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-safemail}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-parser:
    build: ./ml-parser
    container_name: safemail-parser
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: unless-stopped

  ml-enrich:
    build: ./ml-enrich
    container_name: safemail-enrich
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    restart: unless-stopped

  ml-classify:
    build: ./ml-classify
    container_name: safemail-classify
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      # Внешние LLM вместо локальной SLM: ключи только из .env (в репо не коммитить).
      # Qwen через OpenRouter — primary, GigaChat — fallback при его падении.
      # Пусто/нет сети — сервис стартует в rule-based fallback (эвристика главная).
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - GIGACHAT_API_KEY=${GIGACHAT_API_KEY:-}
    restart: unless-stopped

  gateway:
    build: ./gateway-java
    container_name: safemail-gateway
    depends_on:
      postgres:
        condition: service_healthy
      ml-parser:
        condition: service_started
      ml-enrich:
        condition: service_started
      ml-classify:
        condition: service_started
    ports:
      # Хост-порт API наружу; внутри сети frontend ходит на http://gateway:8080 — не трогать.
      - "${GATEWAY_HOST_PORT:-8080}:8080"
      # SMTP: 2525 — дебаг без root, в проде маппить 25->2525 и 587->2587
      - "2525:2525"
      - "2587:2587"
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN:?MAIL_DOMAIN is required - copy .env.example to .env}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-safemail}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-safemail}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-safemail}
      - SMTP_PORT=2525
      - SUBMISSION_PORT=2587
      - PARSER_URL=http://ml-parser:8001
      - ENRICH_URL=http://ml-enrich:8002
      - CLASSIFY_URL=http://ml-classify:8003
      - JWT_SECRET=${JWT_SECRET:-change-me-to-32-chars-minimum-secret}
      # MVP-админ admin@primary (AdminBootstrap): без переменной пароль будет admin
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-admin}
      # Исходящий relay (MVP-фейк): чистые письма и карантин уходят сюда
      - MAIL_RELAY_HOST=mailhog
      - MAIL_RELAY_PORT=1025
      # Адреса ИБ на старте (RoutingRuleSeeder): пусто = infosec@primary-домен из БД
      - ROUTE_TERRORISM=${ROUTE_TERRORISM:-}
      - ROUTE_MAN_MADE=${ROUTE_MAN_MADE:-}
      - ROUTE_ILLEGAL=${ROUTE_ILLEGAL:-}
      - ROUTE_OTHER=${ROUTE_OTHER:-}
    restart: unless-stopped

  # MVP-почтовик: ловит relay-отправку gateway (SMTP :1025, веб-просмотр :8025)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: safemail-mailhog
    ports:
      - "8025:8025"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: safemail-frontend
    # Бежим под UID хоста: иначе root-писанина dev-сервера в ./frontend/.next
    # ломает локальные npm run build/typecheck (EACCES на root-файлах).
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      - gateway
    ports:
      # UI: /login, /inbox, /admin
      - "3008:3008"
    environment:
      # Серверный прокси /backend/* -> gateway (браузер ходит same-origin, CORS не нужен)
      - BACKEND_URL=http://gateway:8080
      - NEXT_PUBLIC_MAIL_DOMAIN=${MAIL_DOMAIN:?MAIL_DOMAIN is required - copy .env.example to .env}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # TLS-терминация (OpenSSL-самоподпись): HTTPS наружу, внутрь — plain HTTP на frontend.
  # Серты генерируются ./nginx/gen-certs.sh, в репо не коммитятся (см. .gitignore).
  nginx:
    image: nginx:1.27-alpine
    container_name: safemail-nginx
    depends_on:
      - frontend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  pgdata:
